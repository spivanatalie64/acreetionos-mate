name: Build ISO
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build env
        run: |
          pacman-key --init && pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm
          pacman -S --noconfirm --needed archiso squashfs-tools dosfstools erofs-utils mtools xorriso libarchive grub edk2-shell awk grep
      - name: Fix packages
        run: |
          sed -i '/^[[:space:]]*#/d' packages.x86_64; sed -i '/^[[:space:]]*$/d' packages.x86_64
          pacman -Sy --config pacman.x86_64.conf 2>/dev/null || true
          for pkg in $(cat packages.x86_64); do pacman -Ss "^${pkg}$" --config pacman.x86_64.conf >/dev/null 2>&1 && echo "$pkg" || echo "Warning: $pkg not found"; done > valid_packages.txt
          mv valid_packages.txt packages.x86_64
      - name: Build ISO
        run: |
          mkdir -p work out && mkarchiso -L "AcreetionOS-MATE" -v -w work -o out -C pacman.x86_64.conf .
          cd out && sha256sum *.iso > SHA256SUMS && md5sum *.iso > MD5SUMS
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acreetionos-mate-${{ github.sha }}
          path: |
            out/*.iso
            out/*.zip
            out/SHA256SUMS
            out/MD5SUMS
          retention-days: 14
      - name: ZIP ISO
        run: cd out && zip -9 "$(basename *.iso .iso).iso.zip" *.iso && ls -lh *.zip
      - name: Upload to R2
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          BUCKET: acreetionos-mate
        run: |
          for F in out/*.iso out/*.zip out/SHA256SUMS; do
            [ ! -f "$F" ] && continue; N=$(basename "$F")
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets" -H "Authorization: Bearer $CF_TOKEN" -d '{"name":"'$BUCKET'"}' || true
            U=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$BUCKET/objects/${N}/upload" -H "Authorization: Bearer $CF_TOKEN" -d '{}' | python3 -c "import sys,json;print(json.load(sys.stdin).get('result',{}).get('uploadURL',''))")
            [ -n "$U" ] && curl -s -X PUT "$U" --data-binary @"$F" && echo "Uploaded $N" || echo "Upload of $N failed"
          done
      - name: Upload to Internet Archive
        env:
          IA_ACCESS: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET: ${{ secrets.IA_SECRET_KEY }}
        run: |
          I=$(ls out/*.iso 2>/dev/null | head -1)
          [ -z "$I" ] && exit 0; [ -z "$IA_ACCESS" ] && echo "No IA creds, skipping" && exit 0
          N=$(basename "$I"); ITEM="AcreetionOS-MATE-$(date +%Y%m%d)"
          curl -s --location \
            --header "authorization: LOW $IA_ACCESS:$IA_SECRET" \
            --header "x-archive-meta01-collection: opensource" \
            --header "x-archive-meta-title: AcreetionOS MATE Edition $N" \
            --header "x-archive-meta-description: Weekly build of AcreetionOS MATE Edition" \
            --header "x-archive-meta-mediatype: software" \
            "https://s3.us.archive.org/$ITEM/$N" --upload-file "$I" && echo "Uploaded to IA" || echo "IA upload failed"
      - name: Upload to SourceForge
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: |
          I=$(ls out/*.iso 2>/dev/null | head -1)
          [ -z "$I" ] && exit 0; [ -z "$SF_USERNAME" ] && echo "No SF creds, skipping" && exit 0
          N=$(basename "$I")
          curl -s -T "$I" "https://sourceforge.net/projects/acreetionos-iso-image/files/mate/$N" \
            --user "$SF_USERNAME:$SF_PASSWORD" && echo "Uploaded to SF" || echo "SF upload failed"
